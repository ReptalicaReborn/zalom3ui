name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
      - run: cargo build --release -p zalo-cli
      - name: Server smoke test
        run: |
          rm -rf /tmp/rust-smoke && mkdir -p /tmp/rust-smoke
          PORT=3999 ACCESS_TOKEN=t DATA_DIR=/tmp/rust-smoke ./target/release/zalom3ui-server > /tmp/rust-smoke/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -H "Authorization: Bearer t" http://127.0.0.1:3999/api/status >/dev/null 2>&1; then
              ready=1
              break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          cat /tmp/rust-smoke/server.log
          test "$ready" = 1
          curl -fsS -H "Authorization: Bearer t" http://127.0.0.1:3999/api/status
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/api/status)" = 401

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      # A missing native library would only show up as a crash on the phone; also ensure legacy Node artifacts stay gone.
      - name: Check APKs contain Rust core and Opus (and no Node.js)
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "$apk: $(du -h "$apk" | cut -f1)"
            unzip -l "$apk" | grep -E "libzalocore\.so|libzaloopus\.so"
            for f in libzalocore.so libzaloopus.so; do
              unzip -l "$apk" | grep -qF "$f" || { echo "::error::$f missing from $apk"; exit 1; }
            done
            for f in libnode.so libc++_shared.so libnodebridge.so assets/server/server.mjs; do
              if unzip -l "$apk" | grep -qF "$f"; then
                echo "::error::unexpected legacy file $f found in $apk"
                exit 1
              fi
            done
          done
      # Without the compiled baseline profile, a sideloaded APK cold-starts interpreted (no Play Store cloud profile).
      - name: Check the release APK carries the baseline profile
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            unzip -l "$apk" | grep -E "assets/dexopt/baseline\.prof" || { echo "::error::assets/dexopt/baseline.prof missing from $apk"; exit 1; }
          done
          # How many app rules made it through R8 (rewritten to minified names), for the log.
          for f in app/build/intermediates/merged_art_profile/release/*/baseline-prof.txt app/build/intermediates/merged_art_profile/release/baseline-prof.txt; do
            [ -f "$f" ] && echo "$f: $(wc -l < "$f") rules, $(grep -c 'zalom3ui' "$f" || true) for com.zalom3ui"
          done || true
      # Debug and R8-optimized release APKs, for arm64-v8a phones.
      - uses: actions/upload-artifact@v4
        with:
          name: zalom3ui-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zalom3ui-release-apk
          path: android/app/build/outputs/apk/release/*.apk
