name: CI

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo test --workspace
      - run: cargo build --release -p zalo-cli
      - name: Server smoke test
        run: |
          rm -rf /tmp/rust-smoke && mkdir -p /tmp/rust-smoke
          PORT=3999 ACCESS_TOKEN=t DATA_DIR=/tmp/rust-smoke ./target/release/zalom3ui-server > /tmp/rust-smoke/server.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ready=0
          for i in $(seq 1 40); do
            if curl -fsS -H "Authorization: Bearer t" http://127.0.0.1:3999/api/status >/dev/null 2>&1; then
              ready=1
              break
            fi
            kill -0 "$pid" 2>/dev/null || break
            sleep 0.5
          done
          cat /tmp/rust-smoke/server.log
          test "$ready" = 1
          curl -fsS -H "Authorization: Bearer t" http://127.0.0.1:3999/api/status
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3999/api/status)" = 401

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon testDebugUnitTest assembleDebug assembleRelease
      # A missing native library would only show up as a crash on the phone; also ensure legacy Node artifacts stay gone.
      - name: Check APKs contain Rust core and Opus (and no Node.js)
        run: |
          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            echo "$apk: $(du -h "$apk" | cut -f1)"
            unzip -l "$apk" | grep -E "libzalocore\.so|libzaloopus\.so"
            for f in libzalocore.so libzaloopus.so; do
              unzip -l "$apk" | grep -qF "$f" || { echo "::error::$f missing from $apk"; exit 1; }
            done
            for f in libnode.so libc++_shared.so libnodebridge.so assets/server/server.mjs; do
              if unzip -l "$apk" | grep -qF "$f"; then
                echo "::error::unexpected legacy file $f found in $apk"
                exit 1
              fi
            done
          done
      # One APK per ABI (app-arm64-v8a-<type>.apk, app-armeabi-v7a-<type>.apk). Nobody can run the 32-bit one in CI, so at
      # least check that each APK holds native libraries of its own architecture (ELF class and machine) and no other ABI's.
      - name: Check each APK carries native libraries for its own ABI
        run: |
          tmp=$(mktemp -d)
          for type in debug release; do
            count=$(ls app/build/outputs/apk/$type/*.apk | wc -l)
            [ "$count" = 2 ] || { echo "::error::expected 2 $type APKs (arm64-v8a, armeabi-v7a), found $count"; ls app/build/outputs/apk/$type; exit 1; }
            for abi in arm64-v8a armeabi-v7a; do
              apk="app/build/outputs/apk/$type/app-$abi-$type.apk"
              [ -f "$apk" ] || { echo "::error::$apk missing"; ls app/build/outputs/apk/$type; exit 1; }
              case "$abi" in
                arm64-v8a) class=02; machine=b700 ;;   # ELFCLASS64, EM_AARCH64 (0xb7)
                armeabi-v7a) class=01; machine=2800 ;; # ELFCLASS32, EM_ARM (0x28)
              esac
              for f in libzalocore.so libzaloopus.so; do
                rm -f "$tmp/$f"
                unzip -q -j "$apk" "lib/$abi/$f" -d "$tmp" || { echo "::error::lib/$abi/$f missing from $apk"; exit 1; }
                hdr=$(od -An -tx1 -N20 "$tmp/$f" | tr -d ' \n')
                if [ "${hdr:0:8}" != 7f454c46 ] || [ "${hdr:8:2}" != "$class" ] || [ "${hdr:36:4}" != "$machine" ]; then
                  echo "::error::lib/$abi/$f in $apk is not an ELF for $abi (header $hdr)"
                  exit 1
                fi
              done
              if unzip -Z1 "$apk" | grep '^lib/' | grep -qv "^lib/$abi/"; then
                echo "::error::$apk holds native libraries for another ABI"
                unzip -Z1 "$apk" | grep '^lib/'
                exit 1
              fi
              echo "$apk: native libraries are $abi"
            done
          done
      # Without the compiled baseline profile, a sideloaded APK cold-starts interpreted (no Play Store cloud profile).
      - name: Check the release APK carries the baseline profile
        run: |
          for apk in app/build/outputs/apk/release/*.apk; do
            unzip -l "$apk" | grep -E "assets/dexopt/baseline\.prof" || { echo "::error::assets/dexopt/baseline.prof missing from $apk"; exit 1; }
          done
          # How many app rules made it through R8 (rewritten to minified names), for the log.
          for f in app/build/intermediates/merged_art_profile/release/*/baseline-prof.txt app/build/intermediates/merged_art_profile/release/baseline-prof.txt; do
            [ -f "$f" ] && echo "$f: $(wc -l < "$f") rules, $(grep -c 'zalom3ui' "$f" || true) for com.zalom3ui"
          done || true
      # Debug and R8-optimized release APKs: two each, one for arm64-v8a phones and one for 32-bit armeabi-v7a phones.
      - uses: actions/upload-artifact@v4
        with:
          name: zalom3ui-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: zalom3ui-release-apk
          path: android/app/build/outputs/apk/release/*.apk
