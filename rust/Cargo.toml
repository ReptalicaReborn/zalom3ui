[workspace]
resolver = "2"
members = [
    "zalo-proto",
    "zalo-media",
    "zalo-server",
    "zalo-cli",
    "zalo-android",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Async & web
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros", "signal", "fs"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws", "multipart", "json"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "limit"] }
http = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "gzip", "deflate", "brotli", "multipart", "json", "stream"] }
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

# Crypto & compression (pure Rust / ring, zero OpenSSL, zero C++ STL)
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ctr = "0.9"
aes-gcm = "0.10"
hmac = "0.12"
sha1 = "0.10"
md-5 = "0.10"
rsa = { version = "0.9", features = ["pem"] }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
lzma-rs = "0.3"
subtle = "2.6"
rand = "0.8"
uuid = { version = "1.11", features = ["v4"] }
base64 = "0.22"
hex = "0.4"
typenum = "1.17"

# Serialization & utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
urlencoding = "2.1"
bytes = "1.9"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std", "ansi"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1.11"
percent-encoding = "2.3"

# Android JNI & logging
jni = "0.21"
android_logger = "0.14"
log = "0.4"

# Local crates
zalo-proto = { path = "zalo-proto" }
zalo-media = { path = "zalo-media" }
zalo-server = { path = "zalo-server" }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
# Unwind (not abort): the core runs inside the app process, so a panic must stay catchable at the JNI
# boundary (catch_unwind) and inside one tokio task, instead of killing the whole app.
panic = "unwind"
strip = "symbols"
